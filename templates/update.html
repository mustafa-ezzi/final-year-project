{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Edit Piece • ThreadStory Atelier</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,700;1,700&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        inter: ['Inter', 'sans-serif'],
                        playfair: ['Playfair Display', 'serif'],
                    },
                    colors: {
                        gold: '#B8924A',
                        dark: '#121212',
                        canvas: '#F9F8F6',
                    }
                }
            }
        }
    </script>

    <style>
        body { background-color: #F9F8F6; font-family: 'Inter', sans-serif; overflow-x: hidden; }
        .glass-panel { background: rgba(255,255,255,0.85); backdrop-filter: blur(12px); border: 1px solid rgba(0,0,0,0.05); }
        .input-atelier { background: transparent; border-bottom: 1px solid #E5E1DA; padding: 0.75rem 0; width: 100%; transition: border-color 0.3s; }
        .input-atelier:focus { outline: none; border-bottom-color: #B8924A; }
    </style>
</head>

<body class="block lg:flex min-h-screen">

<div class="lg:hidden flex items-center justify-between p-6 bg-white border-b sticky top-0 z-[60]">
    <h1 class="font-playfair text-xl font-bold tracking-tighter">
        THREADSTORY<span class="text-gold">.</span>
    </h1>
    <button onclick="toggleSidebar(true)" class="p-2 text-dark">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16m-7 6h7"/></svg>
    </button>
</div>

<aside id="sidebar" class="fixed inset-y-0 left-0 w-72 h-screen bg-white border-r flex flex-col z-[100] transform -translate-x-full lg:translate-x-0 lg:sticky lg:top-0 transition-transform duration-300 ease-in-out">
    <div class="p-10 flex justify-between items-center">
        <div>
            <h1 class="font-playfair text-2xl font-bold tracking-tighter">THREADSTORY<span class="text-gold">.</span></h1>
            <p class="text-[9px] tracking-[0.4em] text-stone-400 mt-2 uppercase font-bold">Atelier Control</p>
        </div>
        <button onclick="toggleSidebar(false)" class="lg:hidden p-2 text-stone-400">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
        </button>
    </div>

    <nav class="flex-1 px-6">
        <a href="{% url 'index' %}" class="flex items-center gap-4 py-4 px-4 text-[11px] font-bold tracking-widest uppercase text-stone-400 hover:text-dark">
            ← Back to Inventory
        </a>
    </nav>
</aside>

<main class="flex-1 p-6 md:p-12">
    <header class="mb-10 md:mb-16">
        <h4 class="text-[10px] font-bold tracking-[0.4em] text-gold uppercase mb-2">Editor Suite</h4>
        <h2 class="font-playfair text-3xl md:text-4xl font-bold leading-tight">
            Refine <span class="italic text-stone-400">“{{ d.name }}”</span>
        </h2>
    </header>

    <form action="{% url 'update' d.id %}" method="POST" enctype="multipart/form-data" class="grid grid-cols-1 lg:grid-cols-12 gap-8 lg:gap-16">
        {% csrf_token %}

        <div class="lg:col-span-5 order-2 lg:order-1">
            <div class="lg:sticky lg:top-12">
                <p class="text-[10px] font-bold tracking-widest text-stone-400 uppercase mb-6">Atelier Imagery</p>
                <div class="grid grid-cols-2 lg:grid-cols-4 lg:grid-cols-2 gap-4">
                    
                    <div class="relative aspect-[3/4] col-span-2 overflow-hidden rounded-2xl border-2 border-gold shadow-lg">
                        <img id="preview-main" src="{{ d.image.url }}" class="w-full h-full object-cover">
                        <label class="absolute inset-0 flex items-center justify-center bg-black/20 hover:bg-black/40 transition-all cursor-pointer group">
                            <span class="bg-white/90 backdrop-blur px-6 py-3 rounded-full text-[9px] font-bold uppercase tracking-widest group-hover:scale-105 transition-transform">
                                Update Cover
                            </span>
                            <input type="file" name="image" class="hidden" onchange="previewUpdate(this,'preview-main')">
                        </label>
                    </div>

                    {% for img in gallery %}
                    <div class="relative aspect-[3/4] lg:aspect-square overflow-hidden rounded-xl border border-stone-200">
                        <img id="prev-{{ forloop.counter }}" src="{{ img.image.url }}" class="w-full h-full object-cover">
                    </div>
                    {% endfor %}

                    <div class="relative aspect-[3/4] lg:aspect-square overflow-hidden rounded-xl border-2 border-dashed border-stone-300 flex items-center justify-center hover:border-gold transition-colors">
                        <input type="file" name="gallery" multiple class="absolute inset-0 opacity-0 cursor-pointer" onchange="previewMultiple(this)">
                        <div class="text-center p-4">
                            <svg class="w-5 h-5 mx-auto mb-2 text-stone-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-width="2" d="M12 4v16m8-8H4"/></svg>
                            <span class="text-[8px] uppercase tracking-widest text-stone-400 font-bold block">Add Gallery</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="lg:col-span-7 order-1 lg:order-2">
            <div class="glass-panel p-6 md:p-10 rounded-[2rem] shadow-sm">
                <div class="space-y-8">
                    <div>
                        <label class="text-[10px] font-bold uppercase tracking-widest text-stone-400">Product Name</label>
                        <input type="text" name="name" value="{{ d.name }}" class="input-atelier text-lg font-playfair font-bold" required>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
                        <div>
                            <label class="text-[10px] font-bold uppercase tracking-widest text-stone-400">Price (PKR)</label>
                            <input type="number" step="0.01" name="price" value="{{ d.price }}" class="input-atelier" required>
                        </div>
                        <div>
                            <label class="text-[10px] font-bold uppercase tracking-widest text-stone-400">Category</label>
                            <select name="category" class="input-atelier bg-transparent">
                                <option value="Men" {% if d.category == "Men" %}selected{% endif %}>Men</option>
                                <option value="Women" {% if d.category == "Women" %}selected{% endif %}>Women</option>
                                <option value="Kids" {% if d.category == "Kids" %}selected{% endif %}>Kids</option>
                            </select>
                        </div>
                    </div>

                    <div>
                        <label class="text-[10px] font-bold uppercase tracking-widest text-stone-400">Badge</label>
                        <input type="text" name="badge" value="{{ d.badge }}" class="input-atelier" placeholder="e.g., Limited Edition">
                    </div>

                    <div>
                        <label class="text-[10px] font-bold uppercase tracking-widest text-stone-400">Description</label>
                        <textarea name="description" rows="5" class="input-atelier resize-none" required>{{ d.description }}</textarea>
                    </div>

                    <div class="pt-4">
                        <button type="submit" class="w-full bg-dark text-white py-5 rounded-2xl text-[10px] font-bold tracking-[0.4em] uppercase hover:bg-gold transition-all duration-500 shadow-xl shadow-dark/10">
                            Apply Refinements
                        </button>
                        <a href="{% url 'index' %}" class="block text-center mt-6 text-[9px] uppercase tracking-widest text-stone-400 hover:text-dark transition-colors">
                            Discard Changes
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </form>
</main>

<div id="sidebarOverlay" onclick="toggleSidebar(false)" class="fixed inset-0 bg-dark/50 z-[90] hidden lg:hidden backdrop-blur-sm"></div>

<script>
    function toggleSidebar(show) {
        const sidebar = document.getElementById('sidebar');
        const overlay = document.getElementById('sidebarOverlay');
        if (show) {
            sidebar.classList.remove('-translate-x-full');
            overlay.classList.remove('hidden');
            document.body.style.overflow = 'hidden';
        } else {
            sidebar.classList.add('-translate-x-full');
            overlay.classList.add('hidden');
            document.body.style.overflow = 'auto';
        }
    }

    function previewUpdate(input, id) {
        if (input.files && input.files[0]) {
            const reader = new FileReader();
            reader.onload = e => document.getElementById(id).src = e.target.result;
            reader.readAsDataURL(input.files[0]);
        }
    }

    function previewMultiple(input) {
        // Log files for now - could be used to build dynamic preview grid
        [...input.files].forEach(file => console.log("Selected:", file.name));
    }
</script>

</body>
</html>
