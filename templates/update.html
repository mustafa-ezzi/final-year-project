{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" type="image/x-icon" href="{% static 'favicon.ico' %}">
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Edit Piece • ThreadStory Atelier</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,700;1,700&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        inter: ['Inter', 'sans-serif'],
                        playfair: ['Playfair Display', 'serif'],
                    },
                    colors: {
                        gold: '#B8924A',
                        dark: '#121212',
                        canvas: '#F9F8F6',
                    }
                }
            }
        }
    </script>

    <style>
        body { background-color: #F9F8F6; font-family: 'Inter', sans-serif; }
        .glass-panel { background: rgba(255,255,255,0.85); backdrop-filter: blur(12px); border: 1px solid rgba(0,0,0,0.05); }
        .input-atelier { background: transparent; border-bottom: 1px solid #E5E1DA; padding: 0.75rem 0; width: 100%; }
        .input-atelier:focus { outline: none; border-bottom-color: #B8924A; }
    </style>
</head>

<body class="flex">

<!-- SIDEBAR -->
<aside class="w-72 h-screen sticky top-0 bg-white border-r flex flex-col z-50">
    <div class="p-10">
        <h1 class="font-playfair text-2xl font-bold">
            THREADSTORY<span class="text-gold">.</span>
        </h1>
        <p class="text-[9px] tracking-[0.4em] text-stone-400 mt-2 uppercase font-bold">
            Atelier Control
        </p>
    </div>

    <nav class="flex-1 px-6">
        <a href="{% url 'index' %}"
           class="flex items-center gap-4 py-4 px-4 text-[11px] font-bold tracking-widest uppercase text-stone-400 hover:text-dark">
            ← Back to Inventory
        </a>
    </nav>
</aside>

<!-- MAIN -->
<main class="flex-1 p-12">

<header class="mb-12">
    <h4 class="text-[10px] font-bold tracking-[0.4em] text-gold uppercase mb-2">
        Editor Suite
    </h4>
    <h2 class="font-playfair text-4xl font-bold">
        Refine <span class="italic text-stone-400">“{{ d.name }}”</span>
    </h2>
</header>

<form action="{% url 'update' d.id %}"
      method="POST"
      enctype="multipart/form-data"
      class="grid lg:grid-cols-12 gap-12">

{% csrf_token %}

<!-- LEFT: IMAGES -->
<div class="lg:col-span-5">
    <div class="sticky top-12">

        <p class="text-[10px] font-bold tracking-widest text-stone-400 uppercase mb-6">
            Atelier Imagery
        </p>

        <div class="grid grid-cols-2 gap-4">

            <!-- MAIN IMAGE -->
            <div class="relative aspect-[3/4] col-span-2 overflow-hidden rounded-xl border-2 border-gold">
                <img id="preview-main" src="{{ d.image.url }}" class="w-full h-full object-cover">
                <label class="absolute inset-0 flex items-center justify-center bg-black/30 cursor-pointer">
                    <span class="bg-white px-6 py-3 rounded-full text-[9px] font-bold uppercase">
                        Update Cover
                    </span>
                    <input type="file" name="image" class="hidden"
                           onchange="previewUpdate(this,'preview-main')">
                </label>
            </div>

            <!-- GALLERY IMAGES -->
            {% for img in gallery %}
            <div class="relative aspect-square overflow-hidden rounded-xl border">
                <img id="prev-{{ forloop.counter }}" src="{{ img.image.url }}" class="w-full h-full object-cover">
            </div>
            {% endfor %}

            <!-- ADD NEW GALLERY -->
            <div class="relative aspect-square overflow-hidden rounded-xl border-2 border-dashed flex items-center justify-center">
                <input type="file"
                       name="gallery"
                       multiple
                       class="absolute inset-0 opacity-0 cursor-pointer"
                       onchange="previewMultiple(this)">
                <span class="text-[10px] uppercase tracking-widest text-stone-400">
                    Add Gallery
                </span>
            </div>

        </div>
    </div>
</div>

<!-- RIGHT: FORM -->
<div class="lg:col-span-7 glass-panel p-10 rounded-2xl">

<div class="space-y-8">

<div>
    <label class="text-[10px] font-bold uppercase tracking-widest text-stone-400">
        Product Name
    </label>
    <input type="text" name="name" value="{{ d.name }}" class="input-atelier text-lg font-playfair font-bold" required>
</div>

<div class="grid grid-cols-2 gap-8">
    <div>
        <label class="text-[10px] font-bold uppercase tracking-widest text-stone-400">
            Price (PKR)
        </label>
        <input type="number" step="0.01" name="price" value="{{ d.price }}" class="input-atelier" required>
    </div>

    <div>
        <label class="text-[10px] font-bold uppercase tracking-widest text-stone-400">
            Category
        </label>
        <select name="category" class="input-atelier">
            <option value="Men" {% if d.category == "Men" %}selected{% endif %}>Men</option>
            <option value="Women" {% if d.category == "Women" %}selected{% endif %}>Women</option>
            <option value="Kids" {% if d.category == "Kids" %}selected{% endif %}>Kids</option>
        </select>
    </div>
</div>

<div>
    <label class="text-[10px] font-bold uppercase tracking-widest text-stone-400">
        Badge
    </label>
    <input type="text" name="badge" value="{{ d.badge }}" class="input-atelier">
</div>

<div>
    <label class="text-[10px] font-bold uppercase tracking-widest text-stone-400">
        Description
    </label>
    <textarea name="description" rows="5" class="input-atelier resize-none" required>{{ d.description }}</textarea>
</div>

<button type="submit"
        class="w-full bg-dark text-white py-5 rounded-xl text-[10px] font-bold tracking-[0.3em] uppercase hover:bg-gold transition">
    Apply Refinements
</button>

<a href="{% url 'index' %}"
   class="block text-center mt-4 text-[9px] uppercase tracking-widest text-stone-400 hover:text-dark">
    Discard Changes
</a>

</div>
</div>
</form>
</main>

<script>
function previewUpdate(input, id) {
    const reader = new FileReader();
    reader.onload = e => document.getElementById(id).src = e.target.result;
    reader.readAsDataURL(input.files[0]);
}

function previewMultiple(input) {
    [...input.files].forEach(file => console.log("Selected:", file.name));
}
</script>

</body>
</html>
